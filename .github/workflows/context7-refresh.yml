name: Refresh Context7 docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - context7.json

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          # Without the secret, skip rather than fail
          if [ -z "$CONTEXT7_API_KEY" ]; then echo "CONTEXT7_API_KEY isn't set: skipping"; exit 0; fi
          curl -sS --fail-with-body -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CONTEXT7_API_KEY" \
            -d '{"libraryName": "/${{ github.repository }}"}'
